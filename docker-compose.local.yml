version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: oracle-guild-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oracleguild
    ports:
      - "5432:5432"
    volumes:
      - oracle_guild_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: oracle-guild-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  oracle_guild_pg:
